actions:
  openapiHarvested: false
  reason: |
    No public first-party API and no downloadable specification exist to harvest.
    Record is identity-only (built-stub): honest "no public API, aggregator-only
    (Plaid)" posture. No FDX membership or Section 1033 API documented.
