name: Cadence Bank
kind: company
description: Cadence Bank is a regional U.S. commercial bank headquartered in Tupelo,
  Mississippi and Houston, Texas, formed in October 2021 when legacy Cadence Bancorporation
  merged into BancorpSouth Bank (the surviving entity, subsequently renamed Cadence
  Bank; NYSE ticker CADE). It is a Mississippi state-chartered bank operating roughly
  400+ branches across the U.S. South, Midwest, and Texas with about $48-50 billion
  in assets, offering consumer banking, mortgages, home equity, credit cards, small
  business and commercial banking, treasury management, and wealth/insurance services.
  On open finance, Cadence Bank exposes no first-party public developer API or developer
  portal; consumer-permissioned account data is reachable only through third-party
  aggregators (notably Plaid), which is the honest, prevailing posture for most U.S.
  regional banks. No documented direct FDX (Financial Data Exchange) membership or
  published CFPB Section 1033 data-access API was found as of this profile.
